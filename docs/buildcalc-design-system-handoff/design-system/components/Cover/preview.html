<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--ground); }
  .wrap { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--ground); font-family: var(--font-sans); }
  svg { position: absolute; inset: 0; }
  .accent { fill: var(--accent); } .ink { fill: var(--ink); } .adjusted { fill: var(--adjusted); } .sheet { fill: var(--sheet); } .wash { fill: var(--adjusted-wash); }
  .r { stroke: var(--rule); stroke-width: 1; } .rk { stroke: var(--on-accent); stroke-width: 1; }
  .dbl { stroke: var(--ground); stroke-width: 1; }
  .name { position: absolute; left: 32px; bottom: 56px; margin: 0; font-size: 88px; line-height: .95; font-weight: 800; letter-spacing: -1px; color: var(--ink); }
  .tag { position: absolute; left: 32px; bottom: 28px; margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style></head>
<body>
<div class="wrap">
  <!-- blocks: accent 240x288 slab, ink 192x96, sheet 192x96, adjusted 96x96, adjusted-wash 96x96.
       arrangement: flush modular grid on a 96 module, bleeding off top and right, like ledger columns.
       pattern: editorial row, "borders not shadows" - a few rule tokens crossing the slab as ruled ledger entries, closed by the double rule of a finished sum.
       scales: 96 = 6 x space-16, rule pitch 48 = 2 x space-24, corners radius-none. -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="accent" x="528" y="0" width="240" height="288"/>
    <rect class="ink" x="768" y="0" width="192" height="96"/>
    <rect class="sheet" x="768" y="96" width="192" height="96"/>
    <rect class="adjusted" x="768" y="192" width="96" height="96"/>
    <rect class="wash" x="864" y="192" width="96" height="96"/>
    <line class="rk" x1="528" x2="768" y1="48" y2="48"/>
    <line class="rk" x1="528" x2="768" y1="96" y2="96"/>
    <line class="rk" x1="528" x2="768" y1="144" y2="144"/>
    <line class="rk" x1="528" x2="768" y1="192" y2="192"/>
    <line class="rk" x1="528" x2="768" y1="236" y2="236"/>
    <line class="rk" x1="528" x2="768" y1="240" y2="240"/>
  </svg>
  <h1 class="name">Buildcalc</h1>
  <p class="tag">A ruled site fieldbook for material quantities and cost.</p>
</div>
</body>
</html>
